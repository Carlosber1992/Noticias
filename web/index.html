<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yasupo</title>
<meta name="description" content="Yasupo: noticias, artículos y vídeos de canales de tu comunidad.">
<meta name="theme-color" content="#ff5a1f">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/supabase.js"></script>
<style>
/* ============================================================
   1. TOKENS DE DISEÑO (claro / oscuro)
   ============================================================ */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --text:#14161a; --muted:#6b7280;
  --line:#e3e6ea; --accent:#ff5a1f; --accent-ink:#fff; --accent-soft:#fff1eb; --danger:#dc2626;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b21; --surface-2:#22262e; --text:#eceef2; --muted:#9aa1ad;
    --line:#2a2f38; --accent-soft:#3a2218; --danger:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --surface-2:#22262e; --text:#eceef2; --muted:#9aa1ad;
  --line:#2a2f38; --accent-soft:#3a2218; --danger:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4);
}

/* ============================================================
   2. BASE
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:default}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:var(--text)}
.muted{color:var(--muted)}

/* ============================================================
   3. CABECERA
   ============================================================ */
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;max-width:1400px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.5px;flex:none}
.logo-mark{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),#ffb02e,var(--accent));position:relative}
.logo-mark::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.search{flex:1;min-width:0;max-width:620px;display:flex;align-items:center;background:var(--surface-2);border-radius:12px;padding:0 12px;height:40px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:600;flex:none}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.small{padding:6px 12px;font-size:13px}
.menu-btn{display:none}
.me-btn{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;flex:none}
.me-btn:hover{background:var(--surface-2)}

/* ============================================================
   4. ESTRUCTURA
   ============================================================ */
.layout{display:grid;grid-template-columns:240px 1fr;gap:24px;max-width:1400px;margin:0 auto;padding:16px}
main{min-width:0}
aside{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto}
.nav button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;width:100%;text-align:left}
.nav button:hover{background:var(--surface-2)}
.nav .active{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.nav .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 12px 8px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none;text-transform:uppercase}
.avatar.lg{width:72px;height:72px;font-size:30px}
.avatar.md{width:40px;height:40px;font-size:16px}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:220px}

/* ============================================================
   5. FEED
   ============================================================ */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px;gap:12px}
.section-h h2{font-size:20px;margin:0}
.shorts{display:grid;grid-auto-flow:column;grid-auto-columns:160px;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px;scrollbar-width:thin}
.short{aspect-ratio:9/16;border-radius:14px;position:relative;overflow:hidden;color:#fff;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left}
.short::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.7))}
.short > *{position:relative}
.short .emoji{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:52px}
.short b{font-size:13px;line-height:1.3}
.short small{opacity:.8;font-size:12px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.card-head .meta{flex:1;min-width:0}
.card-head .meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-head .meta small{color:var(--muted);font-size:12px}
.follow{font-size:13px;font-weight:600;color:var(--accent);padding:4px 8px;border-radius:8px;flex:none}
.follow.on{color:var(--muted)}
.thumb{aspect-ratio:16/9;position:relative;display:grid;place-items:center;font-size:64px;cursor:pointer}
.thumb .badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:2px 6px;border-radius:6px;font-weight:600}
.thumb .play{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.card-body{padding:12px 14px 4px;cursor:pointer;flex:1}
.card-body h3{margin:0 0 6px;font-size:17px;line-height:1.3}
.card-body p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:4px;padding:8px 8px 10px}
.act{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.act:hover{background:var(--surface-2)}
.act.on{color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
.loader{text-align:center;color:var(--muted);padding:24px}

/* ============================================================
   6. PÁGINAS: CANAL Y CUENTA
   ============================================================ */
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.ch-cover{height:120px;border-radius:16px 16px 0 0;margin:-20px -20px 16px;display:grid;place-items:center;font-size:56px}
.ch-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ch-row h1{margin:0;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:13px}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list-row:first-of-type{border-top:0}
.list-row .grow{flex:1;min-width:0}
.list-row .grow small{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea{background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field small{color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ============================================================
   7. LECTOR, MODAL Y AVISOS
   ============================================================ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;overflow:auto;padding:24px 16px}
.overlay.open{display:block}
.sheet{max-width:760px;margin:0 auto;background:var(--surface);border-radius:20px;overflow:hidden}
.sheet.narrow{max-width:460px;padding:24px;margin-top:6vh}
.sheet h2{margin:0 0 6px}
.reader .thumb{font-size:110px;cursor:default}
.reader-in{padding:24px 28px 32px}
.reader h1{font-size:30px;line-height:1.2;margin:12px 0}
.reader p{font-size:17px;line-height:1.7}
.close{position:fixed;top:16px;right:16px;background:var(--surface);width:44px;height:44px;border-radius:50%;font-size:20px;z-index:51;box-shadow:var(--shadow)}
.comments{border-top:1px solid var(--line);margin-top:24px;padding-top:16px}
.comment{display:flex;gap:10px;margin:16px 0}
.comment .body{flex:1;min-width:0;overflow-wrap:anywhere}
.comment small{color:var(--muted)}
.link-btn{color:var(--muted);font-size:12px;padding:0;text-decoration:underline}
.c-form{display:flex;gap:8px;margin-top:12px}
.c-form input{flex:1;background:var(--surface-2);border:0;border-radius:10px;padding:10px 12px;outline:none;min-width:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;transition:transform .25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.install{position:fixed;left:12px;right:12px;bottom:12px;z-index:55;max-width:460px;margin:0 auto;background:var(--surface);box-shadow:0 8px 30px rgba(0,0,0,.25);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px}
.install p{margin:0;flex:1;min-width:0}
.install .logo-mark{width:36px;height:36px;border-radius:50%;flex:none;background:conic-gradient(from 200deg,var(--accent),#ffb02e,var(--accent));position:relative}
.install .logo-mark::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface)}

/* ============================================================
   8. RESPONSIVE
   ============================================================ */
/* Editor y selector de canal */
.field select{background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;outline:none;color:var(--text);font:inherit}
.field textarea.big{min-height:220px;line-height:1.6}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.emoji-pick{width:40px;height:40px;border-radius:10px;font-size:22px;background:var(--surface-2);border:2px solid transparent}
.emoji-pick.on{border-color:var(--accent)}
.preview-thumb{aspect-ratio:16/9;border-radius:12px;display:grid;place-items:center;font-size:56px;margin-bottom:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);vertical-align:middle;margin-left:4px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.counter{float:right;font-weight:400;color:var(--muted);font-size:12px}

/* Fotos, vídeo y enlaces */
.thumb{overflow:hidden}
.media-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.thumb .count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 6px;border-radius:6px;font-weight:600}
.broken-media{display:grid;place-items:center;color:#fff;background:#333;font-size:13px}
.gallery{position:relative;background:#000}
.gallery-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery-track::-webkit-scrollbar{display:none}
.gallery-track > *{flex:0 0 100%;width:100%;aspect-ratio:16/9;object-fit:contain;scroll-snap-align:center;background:#000}
.gallery video.solo{display:block;width:100%;max-height:70vh;background:#000}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1}
.gallery-nav.prev{left:10px}.gallery-nav.next{right:10px}
.gallery-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gallery-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45)}
.gallery-dots span.on{background:#fff}
.dropzone{display:block;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;margin-top:6px}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.media-grid:empty{display:none}
.media-tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.media-tile img,.media-tile video{width:100%;height:100%;object-fit:cover;display:block}
.media-tile .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:12px}
.media-tile .first{position:absolute;left:4px;bottom:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px}
.media-tile .state{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-size:12px;text-align:center;padding:6px}
.link-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:18px 0}
.link-card:hover{background:var(--surface-2)}
.link-card .grow{flex:1;min-width:0}
.link-card small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-link{display:block;margin-top:6px;color:var(--muted);font-size:13px}

/* Ubicación */
.near-btn{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface-2);flex:none;max-width:220px;white-space:nowrap}
.near-btn .near-label{overflow:hidden;text-overflow:ellipsis}
.near-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.geo-line{display:block;margin-top:6px;color:var(--muted);font-size:13px}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;top:60px;left:0;bottom:0;width:260px;max-height:none;background:var(--bg);z-index:30;padding:16px;transform:translateX(-100%);transition:transform .2s;border-right:1px solid var(--line)}
  aside.open{transform:none}
  .menu-btn{display:grid}
  .hide-sm{display:none}
}
@media (max-width:520px){
  .logo span,.me-btn .me-name{display:none}
  .bar{gap:6px;padding:0 10px}
  .bar .btn{padding:8px 10px}
  .icon-btn{width:36px;height:36px}
  .near-btn{padding:0 10px}
  .near-btn .near-label{display:none}
  .feed{grid-template-columns:1fr}
  .reader-in{padding:18px}
  .reader h1{font-size:24px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="icon-btn menu-btn" data-act="menu" aria-label="Menú">☰</button>
    <a href="#" class="logo" data-act="home"><div class="logo-mark"></div><span>Yasupo</span></a>
    <label class="search">🔍&nbsp;<input id="q" placeholder="Buscar artículos, vídeos y canales"></label>
    <button class="near-btn" id="nearBtn" data-act="near" title="Buscar por ubicación">📍 <span class="near-label">Cualquier lugar</span></button>
    <button class="icon-btn" data-act="theme" aria-label="Cambiar tema">🌓</button>
    <div id="meSlot"></div>
  </div>
</header>

<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<div class="overlay" id="readerOv"><button class="close" data-act="close-reader" aria-label="Cerrar">✕</button><div class="sheet reader" id="reader"></div></div>
<div class="overlay" id="modalOv"><div class="sheet narrow" id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>
<datalist id="cityList"></datalist>

<script>
/* ============================================================
   1. UTILIDADES
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const local = {
  get(k, d){ try { return JSON.parse(localStorage.getItem('yasupo:' + k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem('yasupo:' + k, JSON.stringify(v)) } catch {} }
};
function rng(seed){ let s = Math.abs(seed) % 2147483647 || 1; return () => (s = s * 16807 % 2147483647) / 2147483647; }
const fmt = n => n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '').replace('.', ',') + ' mil' : String(n);
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const bytes = o => new TextEncoder().encode(JSON.stringify(o)).length;
function timeAgo(ts){
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return 'ahora';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); if (d === 1) return 'ayer';
  if (d < 30) return `hace ${d} días`;
  return new Date(ts).toLocaleDateString('es', {day:'numeric', month:'short', year:'numeric'});
}
function colorFor(str){ let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 55% 48%)`; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
const SB_URL = 'https://qbcabwbpobqgwblrzhzb.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiY2Fid2Jwb2JxZ3dibHJ6aHpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NDk0NTEsImV4cCI6MjEwOTMyNTQ1MX0.UupboTgpdPZY8nEEYXG08XVNKHokzzorR8KQEKK9Cqg';
const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true}});
const mailOf = u => `${u.toLowerCase()}@usuarios.plaza.invalid`;

/* ============================================================
   2. CATÁLOGO
   ============================================================ */
const CATS = ['Tecnología','Viajes','Cocina','Ciencia','Deportes','Cine','Salud','Finanzas','Hogar'];
const PALETTE = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444','#ec4899','#14b8a6','#64748b','#a16207','#0ea5e9'];
const EMOJIS = ['📰','✍️','💡','🎨','📷','🎵','🌱','🧠','🚀','❤️','🍀','🔥','⭐','🌍','🐾','☕'];
const safeColor = c => PALETTE.includes(c) ? c : PALETTE[0];
const safeEmoji = e => EMOJIS.includes(e) || Object.values(TOPICS).some(t => t.e.includes(e)) ? e : '📰';
const safeCat = c => CATS.includes(c) ? c : CATS[0];

const DEMO_CHANNELS = [
  {id:'c1',name:'Código Abierto',cat:'Tecnología',color:'#3b82f6',about:'Tecnología útil explicada sin jerga.'},
  {id:'c2',name:'Mochila al Hombro',cat:'Viajes',color:'#10b981',about:'Rutas, trenes y pueblos con encanto.'},

function distKm(a, b){
  if (!a || !b) return Infinity;
  const R = 6371, rad = x => x * Math.PI / 180, dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

  writer(pathFn, dataFn){

      dirty = true; if (busy) return; busy = true;
      while (dirty){
        dirty = false;
        const data = dataFn();
        try { data === null ? await API.db.doc(pathFn()).delete() : await API.db.doc(pathFn()).set(data); }
        catch (e){ API.onWriteError(e); break; }

      async set(d){
        const q = uid === S.uid ? sb.from('ys_docs').upsert({col, uid, data: d}) : sb.from('ys_docs').update({data: d}).eq('col', col).eq('uid', uid);
        const {error} = await q; if (error) throw error;
      },
      async delete(){ const {error} = await sb.from('ys_docs').delete().eq('col', col).eq('uid', uid); if (error) throw error; },
    };
  },
};
/** Fotos y vídeos: el id es "<uid>_<archivo>" y se guardan en la carpeta de cada persona. */
const Assets = {
  async upload(blob, {type}){
    const name = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    const {error} = await sb.storage.from(MEDIA).upload(`${S.uid}/${name}`, blob, {contentType: type, upsert: false});
    if (error){
      const m = String(error.message || '') + ' ' + (error.statusCode || '');
      throw {code: /size|large|413/i.test(m) ? 'too_large' : /mime|type|415/i.test(m) ? 'unsupported_type' : /429|rate/i.test(m) ? 'rate_limited' : /403|401|policy|security/i.test(m) ? 'not_granted' : 'failed'};
    }
    const id = S.uid + '_' + name;
    return {id, url: blobUrl(id)};
  },
  async delete(id){ const k = String(id).indexOf('_'); if (k > 0) await sb.storage.from(MEDIA).remove([id.slice(0, k) + '/' + id.slice(k + 1)]); },
};
const saveAccount = API.writer(() => `accounts/${S.uid}`, () => S.accounts[S.uid] ?? null);
const saveChannel = API.writer(() => `channels/${S.uid}`, () => S.channels[S.uid] ?? null);
const saveSaved   = API.writer(() => `data/users/${S.uid}/saved`, () => ({ids: [...S.saved]}));
const perUser = (col, key) => { const ws = {}; return uid => (ws[uid] ||= API.writer(() => `${col}/${uid}`, () => ({items: S[key][uid] || []})))(); };
const saveCommentsOf = perUser('comments', 'comments');
const savePostsOf = perUser('posts', 'posts');

/* ============================================================
   5. ACCIONES
   ============================================================ */
function needAccount(then){
  if (!API.online()){ toast('No hay conexión con Yasupo. Inténtalo de nuevo en un momento.'); return false; }
  if (S.readonly){ toast('Tu acceso a esta página es de solo lectura.'); return false; }
  if (!me()){ enter(then); return false; }
  return true;
}
function patchMe(fn){ const a = structuredClone(me()); fn(a); S.accounts[S.uid] = a; rebuildIndex(); render(); saveAccount(); }
const toggleIn = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
const MAX_POSTS = 40, MAX_BODY = 5000, MAX_DOC = 240000;

const Actions = {
  like(id){ if (!needAccount(() => Actions.like(id))) return;
    patchMe(a => { a.likes = toggleIn(a.likes || [], id); a.dislikes = (a.dislikes || []).filter(x => x !== id); }); },
  dislike(id){ if (!needAccount(() => Actions.dislike(id))) return;
    const adding = !(me().dislikes || []).includes(id);
    patchMe(a => { a.dislikes = toggleIn(a.dislikes || [], id); a.likes = (a.likes || []).filter(x => x !== id); });
    if (adding) toast('Te mostraremos menos contenido como este.'); },
  follow(chId){ if (!needAccount(() => Actions.follow(chId))) return;
    const ch = channelById(chId); if (!ch) return;
    if (ch.owner === S.uid) return toast('Es tu propio canal 🙂');
    const on = !(me().follows || []).includes(chId);
    patchMe(a => { a.follows = toggleIn(a.follows || [], chId); });
    toast(on ? `Ahora sigues a ${ch.name}` : `Has dejado de seguir a ${ch.name}`); },
  save(id){
    const on = !S.saved.has(id); on ? S.saved.add(id) : S.saved.delete(id);
    if (S.uid) saveSaved(); else local.set('saved-guest', [...S.saved]);
    toast(on ? 'Guardado en tu biblioteca' : 'Eliminado de guardados'); render(); },
  comment(itemId, text){
    text = text.trim().slice(0, 500); if (!text) return false;
    if (!needAccount()) return false;
    const list = S.comments[S.uid] || [];
    if (list.length >= 300){ toast('Has llegado al máximo de 300 comentarios. Borra alguno para seguir.'); return false; }
    S.comments[S.uid] = [{id: newId(), itemId, text, at: Date.now()}, ...list];
    rebuildIndex(); render(); saveCommentsOf(S.uid); return true; },
  deleteComment(uid, cid){
    if (uid !== S.uid && !S.isOwner) return;
    S.comments[uid] = (S.comments[uid] || []).filter(c => c.id !== cid);
    rebuildIndex(); render(); saveCommentsOf(uid); toast('Comentario eliminado'); },
  createAccount({alias, bio, topics}){
    const follows = DEMO_CHANNELS.filter(c => topics.includes(c.cat)).map(c => c.id);
    S.accounts[S.uid] = {alias, bio, createdAt: Date.now(), follows, likes: [], dislikes: []};
    rebuildIndex(); render(); saveAccount(); },
  updateProfile({alias, bio}){ patchMe(a => { a.alias = alias; a.bio = bio; }); toast('Perfil actualizado'); },
  async deleteAccount(){
    const uid = S.uid;
    dropAssets(S.posts[uid] || []);
    for (const k of ['accounts', 'comments', 'channels', 'posts']) delete S[k][uid];
    rebuildIndex(); S.view = 'feed'; render();
    try { await Promise.all(['comments', 'posts', 'channels'].map(c => API.db.doc(`${c}/${uid}`).delete())); await API.db.doc(`accounts/${uid}`).delete(); await API.db.doc(`data/users/${uid}/saved`).delete(); await sb.auth.signOut(); S.uid = null; S.saved = new Set(); render(); toast('Tu cuenta se ha eliminado'); }
    catch (e){ API.onWriteError(e); } },

  saveChannel(data){
    const isNew = !S.channels[S.uid];
    S.channels[S.uid] = {...(S.channels[S.uid] || {createdAt: Date.now()}), ...data};
    rebuildIndex(); saveChannel();
    toast(isNew ? `¡Tu canal «${data.name}» está listo!` : 'Canal actualizado');
    go({view: 'channel', channel: userChannelId(S.uid), cat: 'Todo', q: ''}); },
  async deleteChannel(){
    const uid = S.uid; delete S.channels[uid];
    rebuildIndex(); S.view = 'account'; render();
    try { await API.db.doc(`channels/${uid}`).delete(); toast((S.posts[uid] || []).length ? 'Canal eliminado. Tus publicaciones siguen en tu perfil personal.' : 'Canal eliminado'); }
    catch (e){ API.onWriteError(e); } },

  publish({pid, title, excerpt, body, emoji, media, link, geo, cat}){
    const list = (S.posts[S.uid] || []).slice();
    let post;
    if (pid){ const i = list.findIndex(p => p.id === pid); if (i < 0) return 'Esta publicación ya no existe.';
      post = {...list[i], title, excerpt, body, emoji, media, link, geo, cat, editedAt: Date.now()}; list[i] = post; }
    else { if (list.length >= MAX_POSTS) return `Puedes tener hasta ${MAX_POSTS} publicaciones. Borra alguna para publicar otra.`;
      post = {id: newId(), title, excerpt, body, emoji, media, link, geo, cat, at: Date.now()}; list.unshift(post); }
    if (bytes({items: list}) > MAX_DOC) return 'Tu canal ha llegado al límite de espacio. Acorta el texto o borra publicaciones antiguas.';
    S.posts[S.uid] = list; rebuildIndex(); savePostsOf(S.uid);
    toast(pid ? 'Publicación actualizada' : '¡Publicado! Ya está en el feed.');
    return {id: 'p_' + post.id}; },
  deletePost(uid, pid){
    if (uid !== S.uid && !S.isOwner) return;
    const gone = (S.posts[uid] || []).find(p => p.id === pid);
    S.posts[uid] = (S.posts[uid] || []).filter(p => p.id !== pid);
    if (gone) dropAssets([gone]);
    closeReader(); rebuildIndex(); render(); savePostsOf(uid); toast('Publicación eliminada'); },
};

function validateAlias(alias){
  if (alias.length < 3 || alias.length > 24) return 'El alias debe tener entre 3 y 24 caracteres.';
  if (!/^[\p{L}\p{N}_.\- ]+$/u.test(alias)) return 'Usa solo letras, números, espacios, puntos, guiones o guiones bajos.';
  if (S.aliasTaken.has(alias.toLowerCase())) return 'Ese alias ya está en uso. Prueba con otro.';
  return '';
}
function validateChannelName(name){
  if (name.length < 3 || name.length > 40) return 'El nombre debe tener entre 3 y 40 caracteres.';
  if (/[<>]/.test(name)) return 'El nombre no puede contener < ni >.';
  if (S.channelNames.has(name.toLowerCase())) return 'Ya existe un canal con ese nombre.';
  return '';
}

   6. CONSULTAS SOBRE EL FEED
   ============================================================ */
function visibleIds(){
  const demo = Array.from({length: S.near ? Math.max(S.pool, 300) : S.pool}, (_, i) => 'd' + (i + 1));
  let ids = [...S.communityOrder, ...demo];
  const a = me(), follows = new Set(a?.follows || []), dis = new Set(a?.dislikes || []);
  if (S.view === 'following') ids = ids.filter(id => follows.has(item(id).ch.id));
  if (S.view === 'liked') ids = (a?.likes || []).slice().reverse();
  if (S.view === 'saved') ids = [...S.saved].reverse();
  if (S.view === 'channel') ids = ids.filter(id => item(id).ch.id === S.channel);
  ids = ids.filter(id => item(id));
  if (S.view === 'feed') ids = ids.filter(id => !dis.has(id));
  if (S.cat === 'Vídeos') ids = ids.filter(id => item(id).type === 'video');
  else if (S.cat === 'Artículos') ids = ids.filter(id => item(id).type === 'article');
  else if (S.cat === 'Comunidad') ids = ids.filter(id => item(id).community);
  else if (S.cat !== 'Todo') ids = ids.filter(id => (item(id).cat || item(id).ch.cat) === S.cat);
  if (S.q){ const q = S.q.toLowerCase(); ids = ids.filter(id => { const i = item(id); return (i.title + ' ' + i.ch.name + ' ' + i.ch.cat).toLowerCase().includes(q); }); }
  if (S.near){
    const here = CITY_BY_ID[S.near.city], dist = id => distKm(here, CITY_BY_ID[item(id).geo?.city]);
    ids = ids.filter(id => dist(id) <= S.near.radius).sort((x, y) => dist(x) - dist(y) || item(y).ts - item(x).ts);
  }
  if (S.view === 'feed' && follows.size && !S.near){
    const out = []; for (let i = 0; i < ids.length; i += 12){
      const block = ids.slice(i, i + 12);
      out.push(...block.filter(id => follows.has(item(id).ch.id)), ...block.filter(id => !follows.has(item(id).ch.id)));
    } ids = out;
  }
  return ids;
}
const isInfinite = () => S.view === 'feed' && !S.q && S.cat !== 'Comunidad' && !S.near;

let afterSignup = null, afterLogin = null;

/** Cerrar sesión: este navegador vuelve a modo invitado. */
async function logout(){
  try { await sb.auth.signOut(); } catch {}
  S.uid = null; S.isOwner = false; S.recovery = null; S.saved = new Set(local.get('saved-guest', []));
  rebuildIndex(); go({view: 'feed', channel: null});
  toast('Has cerrado sesión en Yasupo.');
}
/** Entrar: sin sesión, se pide usuario y contraseña; con sesión pero sin perfil, se completa el perfil. */
function enter(then){
  if (!API.online()) return toast('No hay conexión con Yasupo. Inténtalo de nuevo en un momento.');
  if (!S.uid) return openAuth(then);
  openSignup(then);
}
let afterAuth = null, authMode = 'login';

/* ---------- Respaldo: correo y celular (opcionales) ---------- */
S.recovery = null;
async function loadRecovery(){
  if (!S.uid){ S.recovery = null; return; }
  try { const {data} = await sb.from('plaza_recovery').select('email,phone,email_verified_at,phone_verified_at').eq('user_id', S.uid).maybeSingle(); S.recovery = data || null; } catch {}
}
const normPhone = p => { let d = String(p || '').replace(/[\s().-]/g, ''); if (/^3\d{9}$/.test(d)) d = '+57' + d; return /^\+[1-9]\d{7,14}$/.test(d) ? d : ''; };
const okEmail = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e) && e.length <= 254;
async function accountFn(body){
  const r = await sb.functions.invoke('yasupo-account', {body});
  if (r.error){ let m = 'Algo salió mal. Inténtalo de nuevo.'; try { m = (await r.error.context.json()).error || m; } catch {} throw new Error(m); }
  return r.data;
}
function recoveryHTML(){
  const r = S.recovery || {};
  const state = (val, at, ch) => !val ? '' : at ? '<span class="tag" style="background:#dcfce7;color:#166534">✓ Verificado</span>'
    : `<span class="tag">Sin verificar</span> <button type="button" class="link-btn" style="font-size:13px" data-act="verify-contact" data-ch="${ch}">Verificar ahora</button>`;
  return `<section class="panel"><h2 style="margin-top:0">🔐 Respaldo de tu cuenta <span class="muted" style="font-size:14px;font-weight:400">(opcional)</span></h2>
    <p class="muted" style="margin-top:0">Asocia tu correo o tu celular para recuperar tu cuenta si olvidas la contraseña. Solo tú los ves; no se muestran a nadie.</p>
    <form data-form="recovery">
      <div class="field"><label for="rEmail">Correo ${state(r.email, r.email_verified_at, 'email')}</label><input id="rEmail" name="email" type="email" inputmode="email" maxlength="254" value="${esc(r.email || '')}" placeholder="tucorreo@ejemplo.com" autocomplete="email"></div>
      <div class="field"><label for="rPhone">Celular ${state(r.phone, r.phone_verified_at, 'phone')}</label><input id="rPhone" name="phone" type="tel" inputmode="tel" maxlength="20" value="${esc(r.phone || '')}" placeholder="+57 300 123 4567" autocomplete="tel"><small>Con el indicativo del país. Si es de Colombia, basta con los 10 dígitos.</small></div>
      <div class="err" data-err></div><button class="btn">Guardar respaldo</button>
    </form></section>`;
}
async function saveRecovery(f, err){
  const email = f.elements.email.value.trim().toLowerCase(), phoneTxt = f.elements.phone.value.trim(), phone = phoneTxt ? normPhone(phoneTxt) : '';
  if (email && !okEmail(email)) return err.textContent = 'Ese correo no parece válido.';
  if (phoneTxt && !phone) return err.textContent = 'Escribe el celular con el indicativo del país, por ejemplo +57 300 123 4567.';
  const btn = f.querySelector('button.btn'); btn.disabled = true; err.textContent = '';
  const {data, error} = await sb.rpc('plaza_recovery_save', {p_email: email || null, p_phone: phone || null});
  btn.disabled = false;
  if (error) return err.textContent = 'No se pudo guardar. Inténtalo de nuevo.';
  const before = S.recovery || {};
  S.recovery = data; f.elements.email.defaultValue = f.elements.email.value = data?.email || ''; f.elements.phone.defaultValue = f.elements.phone.value = data?.phone || '';
  render();
  toast(data ? 'Respaldo guardado' : 'Quitaste el correo y el celular de respaldo');
  const next = data && ((data.email && data.email !== before.email && 'email') || (data.phone && data.phone !== before.phone && 'phone'));
  if (next) verifyContact(next);
}
async function verifyContact(ch){
  const what = ch === 'email' ? 'correo' : 'celular';
  let sent;
  try { sent = await accountFn({action: 'verify-send', channel: ch}); }
  catch (e){ return toast(e.message); }
  showModal(`<h2>Verifica tu ${what}</h2>
    <p class="muted" style="margin-top:0">Enviamos un código de 6 dígitos a <b>${esc(sent.sentTo || '')}</b>. Vence en 15 minutos.</p>
    <form data-form="verify" data-ch="${ch}">
      <div class="field"><label for="vCode">Código</label><input id="vCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="123456"></div>
      ${actionsRow('Verificar')}
      <p style="margin:14px 0 0;text-align:center"><button type="button" class="link-btn" style="font-size:14px" data-act="verify-contact" data-ch="${ch}">Enviar otro código</button></p>
    </form>`, '#vCode');
}
async function submitVerify(f, err){
  const btn = f.querySelector('button.btn:not(.ghost)'); btn.disabled = true; err.textContent = '';
  try { await accountFn({action: 'verify', channel: f.dataset.ch, code: f.elements.code.value.trim()}); }
  catch (e){ btn.disabled = false; return err.textContent = e.message; }
  await loadRecovery(); closeModal(); render();
  toast(f.dataset.ch === 'email' ? '¡Correo verificado!' : '¡Celular verificado!');
}
async function changePassword(f, err){
  const a = f.elements.pass.value, b = f.elements.pass2.value;
  if (a.length < 8) return err.textContent = 'La contraseña necesita al menos 8 caracteres.';
  if (a !== b) return err.textContent = 'Las dos contraseñas no coinciden.';
  const btn = f.querySelector('button.btn'); btn.disabled = true; err.textContent = '';
  const {error} = await sb.auth.updateUser({password: a});
  btn.disabled = false;
  if (error) return err.textContent = /different|same/i.test(error.message) ? 'La contraseña nueva debe ser distinta de la actual.' : 'No se pudo cambiar. Vuelve a entrar e inténtalo de nuevo.';
  f.reset(); toast('Contraseña cambiada');
}

/* ---------- Recuperar la contraseña ---------- */
let recoverUser = '';
function openForgot(step){
  if (step === 2) return showModal(`<h2>Crea una contraseña nueva</h2>
    <p class="muted" style="margin-top:0">Si los datos coinciden con una cuenta, te enviamos un código de 6 dígitos. Vence en 15 minutos.</p>
    <form data-form="reset">
      <div class="field"><label for="fCode">Código</label><input id="fCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="123456"></div>
      <div class="field"><label for="fPass">Contraseña nueva</label><input id="fPass" name="pass" type="password" minlength="8" maxlength="72" required autocomplete="new-password"><small>Al menos 8 caracteres.</small></div>
      ${actionsRow('Cambiar y entrar')}
      <p style="margin:14px 0 0;text-align:center"><button type="button" class="link-btn" style="font-size:14px" data-act="forgot">Pedir otro código</button></p>
    </form>`, '#fCode');
  showModal(`<h2>Recupera tu cuenta</h2>
    <p class="muted" style="margin-top:0">Escribe tu usuario y el correo o celular que asociaste a tu cuenta. Te enviaremos un código.</p>
    <form data-form="forgot">
      <div class="field"><label for="fUser">Usuario</label><input id="fUser" name="user" maxlength="20" required autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(recoverUser)}"></div>
      <div class="field"><label for="fContact">Correo o celular de respaldo</label><input id="fContact" name="contact" maxlength="254" required autocomplete="email" placeholder="tucorreo@ejemplo.com o +57 300 123 4567"></div>
      ${actionsRow('Enviar código')}
      <p class="muted" style="margin:14px 0 0;font-size:13px">¿No asociaste correo ni celular? Entonces no es posible recuperar la cuenta automáticamente.</p>
    </form>`, recoverUser ? '#fContact' : '#fUser');
}
async function submitForgot(f, err){
  const user = f.elements.user.value.trim(), c = f.elements.contact.value.trim();
  if (!/^[A-Za-z0-9._]{3,20}$/.test(user)) return err.textContent = 'Escribe tu usuario de Yasupo.';
  const contact = c.includes('@') ? c.toLowerCase() : (normPhone(c) || c);
  if (!(c.includes('@') ? okEmail(contact) : normPhone(c))) return err.textContent = 'Escribe un correo válido o un celular con indicativo (+57…).';
  const btn = f.querySelector('button.btn:not(.ghost)'); btn.disabled = true; err.textContent = '';
  try { await accountFn({action: 'recover', username: user, contact}); }
  catch (e){ btn.disabled = false; return err.textContent = e.message; }
  recoverUser = user; openForgot(2);
}
async function submitReset(f, err){
  const code = f.elements.code.value.trim(), pass = f.elements.pass.value;
  if (pass.length < 8) return err.textContent = 'La contraseña necesita al menos 8 caracteres.';
  const btn = f.querySelector('button.btn:not(.ghost)'); btn.disabled = true; err.textContent = '';
  try {
    await accountFn({action: 'reset', username: recoverUser, code, password: pass});
    const {data, error} = await sb.auth.signInWithPassword({email: mailOf(recoverUser), password: pass});
    if (error) throw new Error('Cambiamos tu contraseña. Entra con la nueva.');
    S.uid = data.user.id; await API.afterAuth(); closeModal(); rebuildIndex(); render();
    toast('Contraseña cambiada. ¡Bienvenida/o de nuevo!');
    if (!me()) openSignup(null, recoverUser);
  } catch (e){ btn.disabled = false; err.textContent = e.message; }
}
function openAuth(then, mode){
  afterAuth = then || null; authMode = mode || authMode;
  const reg = authMode === 'register';
  showModal(`<h2>${reg ? 'Crea tu cuenta en Yasupo' : 'Entrar en Yasupo'}</h2>
    <p class="muted" style="margin-top:0">${reg ? 'Solo necesitas un usuario y una contraseña. Más adelante, si quieres, puedes agregar tu correo o celular para respaldar tu cuenta.' : 'Entra con tu usuario y contraseña de Yasupo.'}</p>
    <div class="chips" style="margin-bottom:14px"><button type="button" class="chip ${reg ? '' : 'on'}" data-act="auth-mode" data-mode="login">Ya tengo cuenta</button><button type="button" class="chip ${reg ? 'on' : ''}" data-act="auth-mode" data-mode="register">Crear cuenta</button></div>
    <form data-form="auth">
      <div class="field"><label for="aUser">Usuario</label><input id="aUser" name="user" maxlength="20" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="p. ej. lectora_curiosa">${reg ? '<small>De 3 a 20 letras, números, punto o guion bajo.</small>' : ''}</div>
      <div class="field"><label for="aPass">Contraseña</label><input id="aPass" name="pass" type="password" minlength="${reg ? 8 : 1}" maxlength="72" required autocomplete="${reg ? 'new-password' : 'current-password'}">${reg ? '<small>Al menos 8 caracteres. Si agregas un correo o celular en «Mi cuenta», podrás recuperarla si la olvidas.</small>' : ''}</div>
      ${actionsRow(reg ? 'Crear cuenta' : 'Entrar')}
      ${reg ? '' : '<p style="margin:14px 0 0;text-align:center"><button type="button" class="link-btn" style="font-size:14px" data-act="forgot">¿Olvidaste tu contraseña?</button></p>'}
    </form>`, '#aUser');
}
async function submitAuth(f, err){
  const user = f.elements.user.value.trim(), pass = f.elements.pass.value, btn = f.querySelector('button.btn:not(.ghost)');
  const reg = authMode === 'register';
  if (!/^[A-Za-z0-9._]{3,20}$/.test(user)) return err.textContent = 'El usuario debe tener de 3 a 20 letras, números, punto o guion bajo.';
  if (reg && pass.length < 8) return err.textContent = 'La contraseña necesita al menos 8 caracteres.';
  btn.disabled = true; err.textContent = '';
  try {
    if (reg){
      const r = await sb.functions.invoke('plaza-register', {body: {username: user, password: pass}});
      if (r.error){ let m = 'No pudimos crear la cuenta. Inténtalo de nuevo.'; try { m = (await r.error.context.json()).error || m; } catch {} throw new Error(m); }
    }
    const {data, error} = await sb.auth.signInWithPassword({email: mailOf(user), password: pass});
    if (error) throw new Error(reg ? 'La cuenta se creó, pero no pudimos entrar. Prueba con «Ya tengo cuenta».' : 'Usuario o contraseña incorrectos.');
    S.uid = data.user.id; await API.afterAuth();
    const then = afterAuth; afterAuth = null;
    closeModal(); rebuildIndex(); render();

/* ---------- Fotos, vídeo y enlaces ---------- */
const MAX_PHOTOS = 10, MAX_FILE = 20 * 1024 * 1024;
const IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'], VIDEO_TYPES = ['video/mp4', 'video/webm'];
const ASSET_RE = /^[A-Za-z0-9_-]{8,80}$/;
const blobUrl = id => { const k = String(id).indexOf('_'); return `${SB_URL}/storage/v1/object/public/${MEDIA}/${id.slice(0, k)}/${id.slice(k + 1)}`; };
/** Solo se aceptan ids de archivo válidos: hasta 10 fotos, o un único vídeo. */
function cleanMedia(m){
  if (!Array.isArray(m)) return [];
  const out = m.filter(x => x && ASSET_RE.test(String(x.id)) && (x.kind === 'image' || x.kind === 'video'))
               .slice(0, MAX_PHOTOS).map(x => ({id: String(x.id), kind: x.kind}));
  const v = out.find(x => x.kind === 'video');
  return v ? [v] : out;
}
function cleanLink(u){ if (!u) return null; try { const x = new URL(String(u)); return x.protocol === 'https:' && x.hostname.includes('.') ? x.href : null; } catch { return null; } }
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } }
const delAsset = id => { if (API.assets && id) API.assets.delete(id).catch(() => {}); };
const dropAssets = posts => posts.forEach(p => cleanMedia(p.media).forEach(m => delAsset(m.id)));

/** Portada de la tarjeta del feed. */
function coverInner(i){

    ? `<video class="media-cover media-el" src="${blobUrl(m.id)}#t=0.1" muted playsinline preload="metadata"></video><span class="play">▶</span>`
    : `<img class="media-cover media-el" src="${blobUrl(m.id)}" alt="" loading="lazy">`;
  return el + (i.media.length > 1 ? `<span class="count">📷 ${i.media.length}</span>` : '');

function renderDraftMedia(){
  const g = $('#mediaGrid'); if (!g || !draft) return;
  g.innerHTML = draft.media.map((m, n) => `<div class="media-tile" ${m.kind === 'image' && m.status === 'ok' && n > 0 ? `data-act="first-media" data-key="${m.key}" title="Usar como portada" style="cursor:pointer"` : ''}>
      ${m.kind === 'video' ? `<video src="${esc(m.url)}" muted playsinline preload="metadata"></video>` : `<img src="${esc(m.url)}" alt="">`}
      ${n === 0 && m.status !== 'err' ? `<span class="first">${m.kind === 'video' ? 'Vídeo' : 'Portada'}</span>` : ''}
      ${m.status === 'up' ? '<span class="state">Subiendo…</span>' : m.status === 'err' ? `<span class="state">⚠️ ${esc(m.msg)}</span>` : ''}
      <button type="button" class="x" data-act="rm-media" data-key="${m.key}" aria-label="Quitar">✕</button></div>`).join('');
  const has = draft.media.some(m => m.status !== 'err');
  $('#emojiWrap').style.display = has ? 'none' : '';
  const dz = $('#drop');
  if (dz) dz.style.display = draft.media.some(m => m.kind === 'video') || draft.media.length >= MAX_PHOTOS ? 'none' : '';
}

/** Reduce fotos grandes (máx. 1920 px) para que suban rápido y ocupen poco. */
async function shrink(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5e6) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
    return b && b.size < file.size ? b : file;
  } catch { return file; }
}
function uploadMsg(e){
  return ({too_large: 'Demasiado grande (máx. 20 MB)', unsupported_type: 'Formato no admitido', quota_or_state: 'No queda espacio',
    rate_limited: 'Demasiadas subidas; espera un poco', not_granted: 'Sin permiso para subir'})[e?.code] || 'No se pudo subir';
}

async function addFiles(fileList){
  const d = draft, err = $('#modal [data-err]'); if (!d || !API.assets) return;
  const files = [...fileList]; err.textContent = '';
  const bad = files.filter(f => !IMAGE_TYPES.includes(f.type) && !VIDEO_TYPES.includes(f.type));
  if (bad.length) err.textContent = `«${bad[0].name}» no es compatible. Usa fotos JPG, PNG, GIF o WebP, o vídeos MP4 o WebM.`;
  const imgs = files.filter(f => IMAGE_TYPES.includes(f.type)), vids = files.filter(f => VIDEO_TYPES.includes(f.type));
  const hasVideo = d.media.some(m => m.kind === 'video'), hasPhotos = d.media.some(m => m.kind === 'image');
  if (vids.length && (vids.length > 1 || imgs.length || hasPhotos || hasVideo))
    return err.textContent = 'La portada puede ser un vídeo o varias fotos, pero no las dos cosas a la vez (y solo un vídeo).';
  if (imgs.length && hasVideo) return err.textContent = 'Ya hay un vídeo. Quítalo si prefieres usar fotos.';
  let pick = vids.length ? vids : imgs;
  const room = MAX_PHOTOS - d.media.length;
  if (pick.length > room){ err.textContent = `Solo caben ${MAX_PHOTOS} fotos; se añadirán las ${room} primeras.`; pick = pick.slice(0, room); }
  const tiles = pick.map(f => ({key: newId(), file: f, kind: f.type.startsWith('video/') ? 'video' : 'image', url: URL.createObjectURL(f), status: 'up'}));
  tiles.forEach(t => { if (t.file.size > MAX_FILE && t.kind === 'video'){ t.status = 'err'; t.msg = 'Demasiado grande (máx. 20 MB)'; } });
  d.media.push(...tiles); renderDraftMedia();
  for (const t of tiles){
    if (t.status !== 'up') continue;
    try {
      const blob = t.kind === 'image' ? await shrink(t.file) : t.file;
      if (blob.size > MAX_FILE) throw {code: 'too_large'};
      const r = await API.assets.upload(blob, {type: blob.type || t.file.type});
      if (d.cancelled || !d.media.includes(t)){ if (!d.done) delAsset(r.id); continue; }
      d.fresh.add(r.id); t.id = r.id; t.status = 'ok';
      URL.revokeObjectURL(t.url); t.url = r.url;
    } catch (e){ t.status = 'err'; t.msg = uploadMsg(e); }
    delete t.file;
    if (draft === d) renderDraftMedia();
  }
}
function removeDraftMedia(key){
  const d = draft; if (!d) return;
  const m = d.media.find(x => x.key === key); if (!m) return;
  d.media = d.media.filter(x => x !== m);
  if (m.url.startsWith('blob:')) URL.revokeObjectURL(m.url);
  if (m.id) d.fresh.has(m.id) ? (delAsset(m.id), d.fresh.delete(m.id)) : d.removed.push(m.id);
  renderDraftMedia();
}
function makeCover(key){
  const d = draft; if (!d) return;
  const m = d.media.find(x => x.key === key); if (!m) return;
  d.media = [m, ...d.media.filter(x => x !== m)]; renderDraftMedia();
}
/** Al cerrar el editor sin publicar, se borran los archivos que se subieron en esa sesión. */
function discardDraft(){
  if (!draft) return;
  const d = draft; draft = null; d.cancelled = true;
  d.media.forEach(m => { if (m.url && m.url.startsWith('blob:')) URL.revokeObjectURL(m.url); });
  if (!d.done) d.fresh.forEach(delAsset);
}

document.addEventListener('click', e => {

  switch (act){

    case 'channel': return go({view: 'channel', channel: el.dataset.ch, cat: 'Todo', q: ''});
    case 'view': return go({view: el.dataset.view, channel: null});
    case 'cat': S.cat = el.dataset.cat; S.shown = 12; return render();
    case 'home': e.preventDefault(); $('#q').value = ''; return go({view: 'feed', cat: 'Todo', q: '', channel: null});
    case 'menu': return $('#side').classList.toggle('open');
    case 'theme': return cycleTheme();
    case 'short': return toast('Reproduciendo clip…');
    case 'signup': return enter();
    case 'logout': return logout();
    case 'auth-mode': return openAuth(afterAuth, el.dataset.mode);
    case 'forgot': { const u = $('#aUser')?.value.trim(); if (u) recoverUser = u; return openForgot(1); }
    case 'verify-contact': return verifyContact(el.dataset.ch);
    case 'near': $('#side').classList.remove('open'); closeReader(); return openNear();
    case 'near-clear': S.near = null; local.set('near', null); go({view: ['channel', 'account'].includes(S.view) ? 'feed' : S.view, channel: null}); return toast('Mostrando publicaciones de cualquier lugar');
    case 'geo-me': return locateMe(el.dataset.target);
    case 'chip': return el.classList.toggle('on');
    case 'pick': {
      el.parentElement.querySelectorAll('[data-act=pick]').forEach(b => b.classList.toggle('on', b === el));
      if (el.dataset.group === 'emoji' && $('#prevThumb')) $('#prevThumb').textContent = el.dataset.val;
      return;
    }
    case 'rm-media': return removeDraftMedia(el.dataset.key);
    case 'first-media': return makeCover(el.dataset.key);
    case 'gal': { const t = el.closest('.gallery').querySelector('.gallery-track'); return t.scrollBy({left: Number(el.dataset.dir) * t.clientWidth, behavior: 'smooth'}); }
    case 'compose': $('#side').classList.remove('open'); closeReader(); return openComposer();
    case 'edit-channel': return openChannelForm();
    case 'edit-post': closeReader(); return openComposer(el.dataset.pid);
    case 'close-modal': return closeModal();
    case 'close-reader': return closeReader();
    case 'del-comment': return Actions.deleteComment(el.dataset.uid, el.dataset.cid);
    case 'del-post': return openConfirm('¿Borrar esta publicación?', 'Se quitará del feed para todo el mundo. No se puede deshacer.', 'confirm-del-post', `data-uid="${esc(el.dataset.uid)}" data-pid="${esc(el.dataset.pid)}"`);
    case 'confirm-del-post': closeModal(); return Actions.deletePost(el.dataset.uid, el.dataset.pid);
    case 'delete-channel': return openConfirm('¿Eliminar tu canal?', `Se borrarán el nombre, la descripción, el icono y el color del canal. Tus publicaciones no se borran: pasarán a tu perfil personal, y quienes te siguen te seguirán viendo.`, 'confirm-delete-channel');
    case 'confirm-delete-channel': closeModal(); return Actions.deleteChannel();
    case 'delete-account': return openConfirm('¿Eliminar tu cuenta?', 'Se borrarán tu perfil, tu canal con sus publicaciones, tus reacciones y tus comentarios. No se puede deshacer.', 'confirm-delete');
    case 'confirm-delete': closeModal(); return Actions.deleteAccount();
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form, err = f.querySelector('[data-err]');
  const picked = group => f.querySelector(`[data-group=${group}].on`)?.dataset.val;
  if (kind === 'near'){
    const c = findCity(f.elements.city.value);
    if (!c) return err.textContent = 'Elige una ciudad de la lista de sugerencias.';
    S.near = {city: c.id, radius: Number(picked('radius')) || 100}; local.set('near', S.near);
    closeModal(); go({view: ['channel', 'account'].includes(S.view) ? 'feed' : S.view, channel: null});
    return toast(`Noticias cerca de ${c.name}`);
  }
  if (kind === 'auth') return submitAuth(f, err);
  if (kind === 'recovery') return saveRecovery(f, err);
  if (kind === 'verify') return submitVerify(f, err);
  if (kind === 'password') return changePassword(f, err);
  if (kind === 'forgot') return submitForgot(f, err);
  if (kind === 'reset') return submitReset(f, err);
  if (kind === 'comment'){ if (Actions.comment(f.dataset.id, f.text.value)) f.text.value = ''; return; }

  if (kind === 'channel'){
    const name = f.elements.name.value.trim().replace(/\s+/g, ' ');
    const problem = name.toLowerCase() === (myChannel()?.name || '').toLowerCase() ? '' : validateChannelName(name);
    if (problem){ err.textContent = problem; return; }
    closeModal();
    return Actions.saveChannel({name, cat: safeCat(f.elements.cat.value), about: f.elements.about.value.trim().slice(0, 200), color: safeColor(picked('color')), emoji: safeEmoji(picked('emoji'))});
  }
  if (kind === 'post'){
    const title = f.elements.title.value.trim(), body = f.elements.body.value.trim().slice(0, MAX_BODY), excerpt = f.elements.excerpt.value.trim().slice(0, 200);
    if (draft?.media.some(m => m.status === 'up')) return err.textContent = 'Espera a que terminen de subirse los archivos.';
    const media = (draft?.media || []).filter(m => m.status === 'ok' && m.id).map(m => ({id: m.id, kind: m.kind}));
    if (title.length < 5) return err.textContent = 'El título debe tener al menos 5 caracteres.';
    if (!media.length && body.length < 20) return err.textContent = 'Escribe al menos 20 caracteres de contenido, o añade una foto o un vídeo.';
    let link = f.elements.link.value.trim();
    if (link){
      if (!/^[a-z][a-z0-9+.-]*:/i.test(link)) link = 'https://' + link;
      link = cleanLink(link);
      if (!link) return err.textContent = 'El enlace no es válido. Debe ser una dirección segura (https://…).';
    }
    let geo = null; const cityTxt = f.elements.city.value.trim();
    if (cityTxt){
      const c = findCity(cityTxt);
      if (!c) return err.textContent = 'Elige la ciudad de la lista de sugerencias (o deja el campo vacío).';
      geo = {city: c.id, place: f.elements.place.value.trim().replace(/[<>]/g, '').slice(0, 60)};
    }
    const res = Actions.publish({pid: f.dataset.pid || null, title, excerpt, body, emoji: safeEmoji(picked('emoji')), media, link: link || '', geo, cat: safeCat(f.elements.cat.value)});
    if (typeof res === 'string') return err.textContent = res;
    if (draft){ draft.done = true; draft.removed.forEach(delAsset); }
    closeModal(); S.view = 'channel'; S.channel = userChannelId(S.uid); S.cat = 'Todo'; S.shown = 12; render(); openReader(res.id); return;
  }

  const alias = f.alias.value.trim().replace(/\s+/g, ' '), bio = f.bio.value.trim().slice(0, 160);
  const problem = (kind === 'profile' && alias.toLowerCase() === (me()?.alias || '').toLowerCase()) ? '' : validateAlias(alias);
  if (problem){ err.textContent = problem; return; }
  if (kind === 'signup'){
    const topics = [...f.querySelectorAll('.chip.on')].map(c => c.dataset.cat);
    Actions.createAccount({alias, bio, topics}); closeModal();
    toast(`¡Te damos la bienvenida a Yasupo, ${alias}!`);
    const then = afterSignup; afterSignup = null; if (then) then();
  }
  if (kind === 'profile') Actions.updateProfile({alias, bio});
});

document.addEventListener('input', e => { if (e.target.id === 'pBody') updateCounter(); });
document.addEventListener('change', e => { if (e.target.id === 'fileIn'){ addFiles(e.target.files); e.target.value = ''; } });
document.addEventListener('dragover', e => { const z = e.target.closest?.('#drop'); if (z){ e.preventDefault(); z.classList.add('drag'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('#drop'); if (z) z.classList.remove('drag'); });
document.addEventListener('drop', e => { const z = e.target.closest?.('#drop'); if (z){ e.preventDefault(); z.classList.remove('drag'); addFiles(e.dataTransfer.files); } });
// Si una foto o un vídeo no se puede cargar, se muestra un aviso en su lugar
document.addEventListener('error', e => {
  const t = e.target;
  if (t instanceof HTMLElement && t.classList.contains('media-el')){
    const d = document.createElement('div');
    d.className = 'broken-media' + (t.classList.contains('media-cover') ? ' media-cover' : '');
    d.textContent = '🖼️ Archivo no disponible'; t.replaceWith(d);
  }
}, true);
// Puntos de la galería
document.addEventListener('scroll', e => {
  const t = e.target;
  if (!(t instanceof Element) || !t.classList.contains('gallery-track')) return;
  const n = Math.round(t.scrollLeft / t.clientWidth);
  t.parentElement.querySelectorAll('.gallery-dots span').forEach((d, k) => d.classList.toggle('on', k === n));
}, true);
$('#readerOv').addEventListener('click', e => { if (e.target.id === 'readerOv') closeReader(); });
$('#modalOv').addEventListener('click', e => { if (e.target.id === 'modalOv') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (modalOpen()) closeModal(); else closeReader(); } });
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); if (S.view === 'account') S.view = 'feed'; S.shown = 12; render(); }, 200); });

const THEMES = ['auto', 'light', 'dark']; let theme = local.get('theme', 'auto');
const applyTheme = () => theme === 'auto' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', theme);
function cycleTheme(){ theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; local.set('theme', theme); applyTheme(); toast('Tema: ' + ({auto:'automático', light:'claro', dark:'oscuro'})[theme]); }

const io = new IntersectionObserver(es => {
  if (!es[0].isIntersecting) return;
  if (isInfinite() && visibleIds().length <= S.shown + 6) S.pool += 24;
  S.shown += 9; render();
}, {rootMargin: '300px'});
function observeLoader(){ io.disconnect(); const l = $('#loader'); if (l && l.style.display !== 'none') io.observe(l); }

/* ============================================================
   11. ARRANQUE
   ============================================================ */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  if (local.get('install-no', 0) > Date.now()) return;
  const b = document.createElement('div'); b.className = 'install';
  b.innerHTML = '<div class="logo-mark"></div><p><b>Instala Yasupo</b><br><small class="muted">Ábrela como una app desde tu pantalla de inicio.</small></p><button class="btn small" data-i="yes">Instalar</button><button class="icon-btn" data-i="no" aria-label="Ahora no">✕</button>';
  b.addEventListener('click', async ev => {
    const k = ev.target.closest('[data-i]')?.dataset.i; if (!k) return;
    b.remove();
    if (k === 'yes' && installEvt){ installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; }
    else local.set('install-no', Date.now() + 7 * 864e5);
  });
  document.body.appendChild(b);
});
window.addEventListener('appinstalled', () => { document.querySelector('.install')?.remove(); installEvt = null; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

applyTheme();
$('#cityList').innerHTML = CITIES.map(c => `<option value="${esc(cityLabel(c))}"></option>`).join('');
render();
API.init();
</script>
</body>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Plaza App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una plaza de barrio. Riel + lista + conversación en escritorio; una columna con barra inferior en celular.
   Cada tipo de espacio tiene su color y su icono: foro (coral), grupo (verde), canal (índigo). El amarillo sol marca lo tuyo. */
:root{
  --bg:#EDF2EE;--surface:#FFFFFF;--surface2:#E3EBE6;--ink:#10302C;--muted:#566D68;--line:#D3DED8;
  --brand:#0A6B5E;--brand-ink:#FFFFFF;--sun:#FFC02E;--sun-ink:#3A2A00;--mine:#FFEBB5;
  --foro:#C8451F;--grupo:#0A6B5E;--canal:#3B4CB8;--danger:#B3261E;--news:#B3261E;
  --park:#CFE6CF;--water:#BBDDEA;--street:#FFFFFF;--block:#E3EBE6;--shade:rgba(16,48,44,.45);
  --hero:#0A4F47;--hero-ink:#F1F8F4;
  --av1:#0A6B5E;--av2:#C8451F;--av3:#3B4CB8;--av4:#8A5A00;--av5:#8E2F6B;--av6:#2B6C93;--on-av:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A19;--surface:#152523;--surface2:#1E322F;--ink:#E6F0EC;--muted:#9DB3AD;--line:#2A403C;
  --brand:#3CC2AC;--brand-ink:#06211D;--sun:#FFC94D;--sun-ink:#2C2000;--mine:#40350F;
  --foro:#FF8A63;--grupo:#3CC2AC;--canal:#A3B0FF;--danger:#FF8A80;--news:#FF8A80;
  --park:#20402F;--water:#1D4250;--street:#2C4541;--block:#182B28;--shade:rgba(0,0,0,.6);
  --hero:#0B3D37;--hero-ink:#F1F8F4;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A19;--surface:#152523;--surface2:#1E322F;--ink:#E6F0EC;--muted:#9DB3AD;--line:#2A403C;
  --brand:#3CC2AC;--brand-ink:#06211D;--sun:#FFC94D;--sun-ink:#2C2000;--mine:#40350F;
  --foro:#FF8A63;--grupo:#3CC2AC;--canal:#A3B0FF;--danger:#FF8A80;--news:#FF8A80;
  --park:#20402F;--water:#1D4250;--street:#2C4541;--block:#182B28;--shade:rgba(0,0,0,.6);
  --hero:#0B3D37;--hero-ink:#F1F8F4;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface2);color:var(--ink)}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:none;color:var(--brand)}
.btn.block{width:100%}
.btn:hover{filter:brightness(.96)}
.icb{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--muted)}
.icb:hover{background:var(--surface2);color:var(--ink)}
.fld{display:grid;gap:6px}
.fld label{font-weight:600;font-size:14px}
.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:0}
.inp:focus{border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:84px}
.err{color:var(--danger);font-size:14px;font-weight:500;min-height:1.2em}
.hint{color:var(--muted);font-size:13px}

/* Entrada */
#auth{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);overflow:auto}
.auth-l{display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:32px;padding-left:max(24px,var(--gl));padding-right:max(24px,var(--gr))}
.auth-box{width:100%;max-width:400px;margin-inline:auto;display:grid;gap:18px}
.logo{font:800 26px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;background:var(--sun);border-radius:50% 50% 50% 6px;display:block}
.auth-box h1{font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:-.025em}
.lead{color:var(--muted);font-size:16px}
.row-in{display:flex;gap:8px}.row-in .inp{min-width:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.auth-r{background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:40px clamp(24px,5vw,72px);overflow:hidden;position:relative}
.auth-r:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--sun);right:-150px;top:-170px}
.auth-r>*{position:relative}
.auth-r h2{font-size:clamp(24px,3vw,34px);font-weight:700;max-width:16em;letter-spacing:-.015em}
.pv{background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;max-width:440px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.pv b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.pv:nth-of-type(2){margin-left:32px}.pv:nth-of-type(3){margin-left:12px}
.pvt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}

/* Marco */
#app{height:100%;display:grid;grid-template-columns:72px 340px minmax(0,1fr)}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px}
.rail .logo i{margin-bottom:10px;width:30px;height:30px}
.nav{width:58px;min-height:54px;border-radius:12px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.nav:hover{background:var(--surface2)}
.nav.on{color:var(--brand);background:var(--surface2)}
.nav.add{background:var(--sun);color:var(--sun-ink)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-h{padding:14px var(--gr) 10px var(--gl);display:grid;gap:10px}
.side-h h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--mine);color:var(--ink)}
.search{position:relative}.search svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.search input{padding-left:40px;min-height:42px;background:var(--bg);border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--bg);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--surface)}
.list{flex:1;overflow-y:auto;min-height:0}
.sec{padding:12px var(--gr) 4px var(--gl);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.li{width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:9px var(--gr) 9px var(--gl)}
.li:hover{background:var(--bg)}.li.on{background:var(--surface2)}
.li .n{font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
.li .n span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.li .s{color:var(--muted);font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.li .m{display:grid;justify-items:end;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.sp{width:46px;height:46px;display:grid;place-items:center;color:var(--on-av);position:relative;flex:none}
.sp.foro{background:var(--foro);border-radius:14px 14px 14px 4px}
.sp.grupo{background:var(--grupo);border-radius:50%}
.sp.canal{background:var(--canal);border-radius:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sp{color:var(--bg)}}
:root[data-theme="dark"] .sp{color:var(--bg)}
.lk svg.i{width:14px;height:14px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--on-av);flex:none;text-transform:uppercase}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.hd{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:64px;padding:8px var(--gr) 8px var(--gl)}
.hd .t{min-width:0;flex:1}
.hd h2{font-size:18px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.25}
.hd .s{color:var(--muted);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hd .sp{width:40px;height:40px}
#scroll{flex:1;overflow-y:auto;min-height:0;padding:16px var(--gr) 16px var(--gl)}
.col{max-width:760px;margin-inline:auto;display:grid;gap:12px}
.card{background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.q{width:100%;text-align:left}
.q:hover{box-shadow:inset 0 0 0 1.5px var(--line)}
.q h3{font-size:18px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{font-weight:600}.who small{color:var(--muted);font-size:13px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.qh h2{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.015em}
.cnt{font:700 15px var(--display);padding:6px 2px 0}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vote{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 10px;border-radius:9px;background:var(--bg);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.vote.on{background:var(--mine);color:var(--ink)}
.best{outline:2px solid var(--sun)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sun);color:var(--sun-ink)}
.bub-wrap{display:flex;gap:8px;align-items:flex-end;max-width:min(82%,560px)}
.bub-wrap.me{margin-left:auto;flex-direction:row-reverse}
.bub{background:var(--surface);border-radius:14px 14px 14px 4px;padding:8px 12px;display:grid;gap:6px;min-width:0}
.me .bub{background:var(--mine);border-radius:14px 14px 4px 14px}
.bub .nm{font-size:13px;font-weight:700;color:var(--brand)}
.bub .tm{font-size:11px;color:var(--muted);justify-self:end;font-variant-numeric:tabular-nums}
.media{display:grid;gap:6px;min-width:0}
.media img,.media video{display:block;width:100%;max-width:480px;max-height:380px;object-fit:cover;border-radius:10px;background:var(--surface2)}
.media audio{width:100%;min-width:220px;max-width:420px}
.loc{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;background:var(--bg);border-radius:10px;overflow:hidden;width:100%;max-width:340px;text-align:left}
.me .loc{background:var(--surface)}
.loc svg.map{width:96px;height:72px;display:block}
.loc div{padding-right:10px;min-width:0}.loc b{display:block;font-size:14px;overflow-wrap:anywhere}.loc small{color:var(--muted)}
.typing{color:var(--muted);font-size:14px;padding:2px 4px}
.foot{background:var(--surface);border-top:1px solid var(--line);padding:8px var(--gr) 8px var(--gl)}
.foot .in{max-width:760px;margin-inline:auto;position:relative;display:grid;gap:6px}
.cmp{display:flex;gap:6px;align-items:flex-end}
.cmp textarea{flex:1;min-width:0;min-height:42px;max-height:120px;resize:none;padding:9px 12px;border-radius:12px;border:0;background:var(--bg);outline:0}
.send{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.pend{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:99px;padding:4px 6px 4px 10px;font-size:13px;max-width:100%}
.pill span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:200px}
.pill button{display:grid;place-items:center}.pill svg.i{width:16px;height:16px}
.menu{position:absolute;bottom:52px;left:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:5;min-width:190px}
.menu button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-weight:500}
.menu button:hover{background:var(--surface2)}
.note{font-size:13px;color:var(--muted);text-align:center}
.gate{margin:auto;max-width:380px;display:grid;gap:12px;text-align:center;justify-items:center;padding:24px}
.gate h2{font-size:24px;font-weight:800}
.mapbox{background:var(--block);border-radius:14px;overflow:hidden;min-width:0;width:100%;max-width:560px;justify-self:center}
svg.map{display:block;width:100%;height:auto}
svg.map text{font:600 11px var(--body);fill:var(--muted)}
.pin{cursor:pointer}
.rad{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.nr{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.nr .t{flex:1;min-width:0}.nr b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nr small{color:var(--muted);display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nr .d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pf{display:flex;gap:14px;align-items:center}.pf .av{width:64px;height:64px;font-size:24px}
.pf h2{font-size:26px;font-weight:800;overflow-wrap:anywhere}
.lnk{display:grid;gap:8px}.lnk-r{display:flex;gap:8px}.lnk-r .inp{min-width:0}
.linked{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.ok{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{font:800 24px var(--display);display:block}.stats span{font-size:13px;color:var(--muted)}
.tabbar{display:none}
.locbar{background:var(--surface);border-radius:14px;padding:10px 12px;display:grid;gap:8px;min-width:0;width:100%}
.locbar .sh-top{flex-wrap:wrap}
.chip svg.i{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.chip.near.on{background:var(--brand);color:var(--brand-ink)}
.kmr{display:flex;align-items:center;gap:10px;min-width:0}
.kmr input{flex:1;min-width:0;accent-color:var(--brand)}
.kmr b{white-space:nowrap;font-variant-numeric:tabular-nums}
.nsearch{display:grid;gap:8px;width:100%;min-width:0}
.nsearch .inp{padding-left:40px;padding-right:44px}
.nsearch .search input{background:var(--surface);border-color:var(--line)}
.nsearch .chip{background:var(--surface)}
.nsearch .search .icb{position:absolute;right:3px;top:3px}
.nsearch .search svg.i{position:static}
.nsearch .search>svg.i{position:absolute;left:12px;top:13px}
.ask-e{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:24px}
.ask-e h2{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em}
.ask-sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ask-sug .chip{background:var(--surface);color:var(--ink);text-align:left}
.ans{display:grid;gap:8px;min-width:0}
.ans-l{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--brand);display:flex;gap:6px;align-items:center}
.ans-l.gen{color:var(--muted)}
.ans-l svg.i{width:16px;height:16px}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.mk button{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px;text-align:left;min-width:0}
.mk button:hover{background:var(--surface2)}
.mk span:last-child{display:grid;min-width:0}.mk b{font-weight:700}.mk small{color:var(--muted);font-size:13px}
.side-h .chip{padding:6px 10px}
.q.fresh{animation:fresh 2.4s ease-out}
.ask-t{background:var(--surface);border-bottom:1px solid var(--line);padding:8px var(--gr) 8px var(--gl)}
.ask-t .seg{max-width:760px;margin-inline:auto;grid-auto-columns:minmax(0,1fr)}
.ask-t .seg button.on{background:var(--brand);color:var(--brand-ink)}
@media (max-width:859px){.ask-t .seg svg.i{display:none}.ask-t .seg button{font-size:14px;white-space:nowrap}}
.com-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ul{font-weight:600;color:inherit}
.ul:hover{text-decoration:underline}
.bub .ul.nm{text-align:left}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nt{display:grid;gap:6px;text-align:left;width:100%}
.nt:hover h3{text-decoration:underline}
.nw-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shg a{text-decoration:none}
.nr.rel{background:var(--bg)}
.mmap{display:none;padding:0 var(--gr) 8px var(--gl)}
@media (min-width:860px){#app.no-side{grid-template-columns:72px minmax(0,1fr)}#app.no-side .side{display:none}}
@media (max-width:859px){.mmap{display:block}}
.nav{position:relative}
.nav .bdg{position:absolute;top:2px;right:6px;min-width:17px;height:17px;font-size:11px;padding:0 4px;background:var(--news);color:var(--surface)}
.pagescroll{flex:1;overflow-y:auto;min-height:0;padding:16px var(--gr) 16px var(--gl)}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--news)}
.nw{display:grid;gap:8px;min-width:0}
.nw h3{font-size:20px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.nw.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{from{box-shadow:0 0 0 3px var(--news)}to{box-shadow:0 0 0 0 transparent}}
.tag.hot{background:var(--news);color:var(--surface)}
.nv{display:grid;gap:6px}
.nv-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc{font:800 18px var(--display);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.sc.pos{color:var(--brand)}.sc.neg{color:var(--news)}
.vote.dn.on{background:var(--news);color:var(--surface)}
.nbar{height:5px;border-radius:9px;background:var(--surface2);overflow:hidden;display:flex}
.nbar i{display:block;background:var(--brand)}
.nbar b{display:block;flex:1;background:var(--news)}
.fw{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:8px 10px;min-width:0}
.fw.flat{background:var(--bg)}
.fw .open{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.fw .t{flex:1;min-width:0;display:grid}
.fw b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fw small{color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.atts{display:flex;gap:6px;flex-wrap:wrap}
#sheet{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:30;padding:16px}
.dlg{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:calc(100% - 16px);overflow-y:auto;display:grid;gap:14px}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dlg h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.code{font:700 20px var(--display);letter-spacing:.06em}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (max-width:859px){
  #auth{grid-template-columns:1fr;align-content:start}
  .auth-l{justify-content:flex-start}
  .auth-r{padding:28px var(--gr) 32px var(--gl)}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  #app .main{display:none}
  #app.show-main .main{display:flex}
  #app.show-main .side{display:none}
  #app.in-space .tabbar{display:none}
  .side{border-right:0}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) 4px max(6px,env(safe-area-inset-left,0px))}
  .tabbar .nav{width:100%;font-size:10.5px}
  .tabbar .nav.add{background:none;color:var(--ink)}
  .tabbar .nav.add svg{background:var(--sun);color:var(--sun-ink);border-radius:8px;padding:2px;width:24px;height:24px}
  #sheet{place-items:end center;padding:0}
  .dlg{border-radius:18px 18px 0 0;max-height:92%;padding-left:var(--gl);padding-right:var(--gr)}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.8s infinite}@keyframes p{0%{r:8;opacity:.55}100%{r:22;opacity:0}}}

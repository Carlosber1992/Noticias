<style>
/* Layout: mesa de control con riel de secciones a la izquierda y trabajo a la derecha; usa la identidad de la app Plaza. */
:root{--bg:#EDF2EE;--surface:#FFFFFF;--surface2:#E3EBE6;--ink:#10302C;--muted:#566D68;--line:#D3DED8;--brand:#0A6B5E;--brand-ink:#FFFFFF;--sun:#FFC02E;--sun-ink:#3A2A00;--danger:#B3261E;--danger-ink:#FFFFFF;--canal:#3B4CB8;--foro:#C8451F;--shade:rgba(16,48,44,.45);

:root[data-theme="dark"]{--bg:#0E1A19;--surface:#152523;--surface2:#1E322F;--ink:#E6F0EC;--muted:#9DB3AD;--line:#2A403C;--brand:#3CC2AC;--brand-ink:#06211D;--sun:#FFC94D;--sun-ink:#2C2000;--danger:#FF8A80;--danger-ink:#3A0906;--canal:#A3B0FF;--foro:#FF8A63;--shade:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body)}
#app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
nav{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font:800 24px/1 var(--display);padding:0 10px 12px}

h1{font:800 28px/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:700 16px/1.3 var(--body);margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.tile:hover{border-color:var(--brand)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.f{display:grid;gap:3px;font-size:12px;color:var(--muted);flex:1 1 150px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
.b{font:600 14px/1.2 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
.b:hover{border-color:var(--brand)}.b[disabled]{opacity:.5;cursor:not-allowed}
.b.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.b.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.b.bad{color:var(--danger);border-color:var(--danger);background:transparent}
.b.badfill{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.b.mini{padding:5px 8px;font-size:13px}
.link{all:unset;cursor:pointer;color:var(--brand);font-weight:600;overflow-wrap:anywhere}
.link:hover{text-decoration:underline}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill.brand{background:var(--brand);color:var(--brand-ink)}.pill.sun{background:var(--sun);color:var(--sun-ink)}.pill.bad{background:var(--danger);color:var(--danger-ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item p{overflow-wrap:anywhere;white-space:pre-wrap}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:130px;border-bottom:1px solid var(--line)}
.chart div{position:relative;height:100%;display:flex;align-items:end}
.chart i{display:block;width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:10px;max-width:560px}
.err{color:var(--danger);font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px}
#shade{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;justify-content:flex-end}
#shade.center{align-items:center;justify-content:center;padding:16px}
.drawer{background:var(--bg);width:min(680px,100%);height:100%;overflow:auto;padding:20px;display:grid;gap:14px;align-content:start}
.dialog{background:var(--surface);border-radius:14px;padding:18px;width:min(440px,100%);display:grid;gap:12px;max-height:100%;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
@media (max-width:760px){#app{grid-template-columns:minmax(0,1fr)}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:8px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));align-items:center}nav button{white-space:nowrap}.logo{padding:0 8px 0 0;font-size:20px}.who{margin:0;padding:0 0 0 10px;border:0;border-left:1px solid var(--line);min-width:150px}main{padding-left:max(16px,env(safe-area-inset-left,0px))}}
</style>

:root{--bg:#F1F4F2;--surface:#FFFFFF;--surface2:#E8EEEB;--ink:#10282A;--muted:#5B6F6C;--line:#DCE4E0;--rail:#0F2A2E;--rail-ink:#D7E6E2;--rail-muted:#8FA9A4;--brand:#0A8F7A;--brand-ink:#FFFFFF;--brand-soft:#D6F1EA;--sun:#FFC02E;--sun-ink:#3A2A00;--sun-soft:#FFF1CC;--danger:#C2362C;--danger-ink:#FFFFFF;--danger-soft:#FCE3E0;--violet:#5B5BD6;--violet-soft:#E6E6FB;--shade:rgba(10,30,32,.5);

:root[data-theme="dark"]{--bg:#0B1617;--surface:#132324;--surface2:#1B3032;--ink:#E4EFEC;--muted:#97AFAA;--line:#243C3E;--rail:#081112;--rail-ink:#D7E6E2;--rail-muted:#7D9894;--brand:#35C9AE;--brand-ink:#04231D;--brand-soft:#123B35;--sun:#FFC94D;--sun-ink:#2C2000;--sun-soft:#3A2F10;--danger:#FF7D70;--danger-ink:#3A0906;--danger-soft:#3E1714;--violet:#A4A4FF;--violet-soft:#25254A;--shade:rgba(0,0,0,.65);--c1:#35C9AE;--c2:#A4A4FF;--c3:#F5A25A;--c4:#FF7D70;--c5:#6CB4EA;--c6:#D08BE6;color-scheme:dark}

.fresh{font-size:12px;color:var(--muted);white-space:nowrap}

.chart{position:relative}

.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-120%)}

.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}

.feed{display:grid;gap:2px}
.fi{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);min-width:0}

.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--k,var(--muted))}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:12px;max-width:560px}

.prof .idt{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
